name: Update JS assets

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_BRANCH: '5.0'
  UPDATE_BRANCH: chore/update-js-assets

jobs:
  update-js:
    name: Update JS assets
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.API_PLATFORM_APP_ID }}
          private_key: ${{ secrets.API_PLATFORM_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'

      - name: Update assets
        run: tools/update-js.sh

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'JS assets are up to date.'
            exit 0
          fi
          git config user.name 'api-platform-bot'
          git config user.email 'api-platform-bot@users.noreply.github.com'
          git switch -C "$UPDATE_BRANCH"
          git add -A src/Symfony/Bundle/Resources/public src/Laravel/public
          git commit -m 'chore: update swagger-ui, redoc and open-sans assets'
          git push --force origin "$UPDATE_BRANCH"
          if [ -z "$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --title 'chore: update swagger-ui, redoc and open-sans assets' --body 'Generated by `tools/update-js.sh` (`.github/workflows/update-js.yml`).'
          fi
